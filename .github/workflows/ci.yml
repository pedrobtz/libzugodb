name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  schedule:
    # Weekly, Mondays at 04:23 UTC: the fuzz job runs each target an hour.
    - cron: '23 4 * * 1'
  workflow_dispatch:
    inputs:
      fuzz_seconds:
        description: Seconds the fuzz job runs each target
        default: '120'

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-gcc, os: ubuntu-24.04, flags: '' }
          - { name: linux-asan-ubsan, os: ubuntu-24.04, flags: '-DSLOTHDB_SANITIZERS=ON' }
          - { name: macos-clang, os: macos-latest, flags: '' }
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DSLOTHDB_BUILD_SHELL=ON ${{ matrix.flags }}
      - name: Build
        run: cmake --build build -j4
      - name: Check docs/dialect.md against the binder's functions
        run: tools/check_dialect.sh
      - name: Check that no symbol of a removed library is left
        run: tools/check_symbols.sh build/src/libslothdb.a
      - name: Test
        run: build/test/slothdb_tests

  # ThreadSanitizer over the whole suite. test_threads.cpp repeats its
  # multi-threaded queries ZUGODB_THREAD_ROUNDS times at thread caps 2 and
  # 4; the first report fails the job. There are no suppressions: one
  # added later must name its issue.
  tsan:
    name: linux-tsan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # The runner's kernel randomises mmap with more bits than clang 18's
      # TSan accepts ("unexpected memory mapping"); 28 is the old default.
      - name: Lower ASLR entropy for TSan
        run: sudo sysctl vm.mmap_rnd_bits=28
      - name: Configure
        run: >-
          cmake -S . -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DCMAKE_C_COMPILER=clang-18 -DCMAKE_CXX_COMPILER=clang++-18
          -DSLOTHDB_TSAN=ON
      - name: Build
        run: cmake --build build -j4
      - name: Test
        env:
          TSAN_OPTIONS: halt_on_error=1 second_deadlock_stack=1
          ZUGODB_THREAD_ROUNDS: '3'
        run: build/test/slothdb_tests

  # The conformance subset (design §5, L14 to L17): DuckDB's test/sql at
  # the tag in test/conformance/duckdb-tag, run by tools/slt at thread caps
  # 1 and 2, one child process per file. Built with ASan and UBSan so that
  # a memory error is a crash every time, not by chance. The counts, the
  # failures and the thread differences must equal the committed ones in
  # test/conformance/, in either direction: a change is committed
  # deliberately (test/conformance/run.sh <zugodb_slt> --update).
  conformance:
    name: conformance (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux, os: ubuntu-24.04, flags: '-DCMAKE_C_COMPILER=clang-18 -DCMAKE_CXX_COMPILER=clang++-18' }
          - { name: macos, os: macos-latest, flags: '' }
    steps:
      - uses: actions/checkout@v4
      # As for linux-tsan: clang 18's sanitizers and the runner's mmap entropy
      - name: Lower ASLR entropy for ASan
        if: runner.os == 'Linux'
        run: sudo sysctl vm.mmap_rnd_bits=28
      - name: Cache the corpus
        uses: actions/cache@v4
        with:
          path: test/conformance/corpus
          key: duckdb-corpus-${{ hashFiles('test/conformance/duckdb-tag') }}
      - name: Fetch the corpus
        run: test/conformance/fetch.sh
      - name: Configure
        run: >-
          cmake -S . -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DSLOTHDB_SANITIZERS=ON -DSLOTHDB_BUILD_TESTS=OFF ${{ matrix.flags }}
      - name: Build
        run: cmake --build build -j4 --target zugodb_slt
      - name: Run and compare with the committed counts
        env:
          CONFORMANCE_OUT: conformance-out
        run: test/conformance/run.sh build/tools/slt/zugodb_slt
      - name: Upload this run's outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conformance-${{ matrix.name }}
          path: conformance-out/
          if-no-files-found: ignore

  mingw:
    name: windows-mingw (UCRT64, as R's Rtools)
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build
      - name: Check docs/dialect.md against the binder's functions
        run: tools/check_dialect.sh
      - name: Check that no symbol of a removed library is left
        run: tools/check_symbols.sh build/src/libslothdb.a
      - name: Test
        run: build/test/slothdb_tests.exe

  # libFuzzer, clang, ASan and UBSan (fuzz/run.sh). Each target runs 120 s
  # on a pull request and an hour on the weekly schedule; any crash, hang,
  # leak, out-of-memory or sanitizer report fails the job, and the input is
  # uploaded. `floor` is the least reach accepted: the edges in `source`
  # that the corpus covers, as libFuzzer's -print_coverage=1 reports them.
  fuzz:
    name: fuzz (${{ matrix.target }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: checkpoint_load, source: src/storage/checkpoint.cpp, floor: 240 }
          - { target: sql, source: src/parser/parser.cpp, floor: 800 }
    env:
      FUZZ_SECONDS: ${{ github.event_name == 'schedule' && '3600' || inputs.fuzz_seconds || '120' }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: >-
          cmake -S . -B build-fuzz -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DCMAKE_C_COMPILER=clang-18 -DCMAKE_CXX_COMPILER=clang++-18
          -DSLOTHDB_FUZZ=ON -DSLOTHDB_BUILD_TESTS=OFF
      - name: Build
        run: cmake --build build-fuzz -j4 --target ${{ matrix.target }}_fuzzer
      - name: Fuzz
        env:
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          export PATH=/usr/lib/llvm-18/bin:$PATH
          fuzz/run.sh ${{ matrix.target }} "$FUZZ_SECONDS" ${{ matrix.source }} ${{ matrix.floor }}
      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: |
            fuzz-artifacts/
            fuzz-work/*.coverage
          if-no-files-found: ignore
