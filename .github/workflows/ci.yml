name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  schedule:
    # Weekly, Mondays at 04:23 UTC: the fuzz job runs each target an hour.
    - cron: '23 4 * * 1'
  workflow_dispatch:
    inputs:
      fuzz_seconds:
        description: Seconds the fuzz job runs each target
        default: '120'

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-gcc, os: ubuntu-24.04, flags: '' }
          - { name: linux-asan-ubsan, os: ubuntu-24.04, flags: '-DSLOTHDB_SANITIZERS=ON' }
          - { name: macos-clang, os: macos-latest, flags: '' }
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DSLOTHDB_BUILD_SHELL=ON ${{ matrix.flags }}
      - name: Build
        run: cmake --build build -j4
      - name: Test
        run: build/test/slothdb_tests

  # ThreadSanitizer over the whole suite. test_threads.cpp repeats its
  # multi-threaded queries ZUGODB_THREAD_ROUNDS times at thread caps 2 and
  # 4; the first report fails the job. There are no suppressions: one
  # added later must name its issue.
  tsan:
    name: linux-tsan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # The runner's kernel randomises mmap with more bits than clang 18's
      # TSan accepts ("unexpected memory mapping"); 28 is the old default.
      - name: Lower ASLR entropy for TSan
        run: sudo sysctl vm.mmap_rnd_bits=28
      - name: Configure
        run: >-
          cmake -S . -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DCMAKE_C_COMPILER=clang-18 -DCMAKE_CXX_COMPILER=clang++-18
          -DSLOTHDB_TSAN=ON
      - name: Build
        run: cmake --build build -j4
      - name: Test
        env:
          TSAN_OPTIONS: halt_on_error=1 second_deadlock_stack=1
          ZUGODB_THREAD_ROUNDS: '3'
        run: build/test/slothdb_tests

  mingw:
    name: windows-mingw (UCRT64, as R's Rtools)
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build
      - name: Test
        run: build/test/slothdb_tests.exe

  # libFuzzer, clang, ASan and UBSan (fuzz/run.sh). Each target runs 120 s
  # on a pull request and an hour on the weekly schedule; any crash, hang,
  # leak, out-of-memory or sanitizer report fails the job, and the input is
  # uploaded. `floor` is the least reach accepted: the edges in `source`
  # that the corpus covers, as libFuzzer's -print_coverage=1 reports them.
  fuzz:
    name: fuzz (${{ matrix.target }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: checkpoint_load, source: src/storage/checkpoint.cpp, floor: 240 }
    env:
      FUZZ_SECONDS: ${{ github.event_name == 'schedule' && '3600' || inputs.fuzz_seconds || '120' }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: >-
          cmake -S . -B build-fuzz -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DCMAKE_C_COMPILER=clang-18 -DCMAKE_CXX_COMPILER=clang++-18
          -DSLOTHDB_FUZZ=ON -DSLOTHDB_BUILD_TESTS=OFF
      - name: Build
        run: cmake --build build-fuzz -j4 --target ${{ matrix.target }}_fuzzer
      - name: Fuzz
        env:
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          export PATH=/usr/lib/llvm-18/bin:$PATH
          fuzz/run.sh ${{ matrix.target }} "$FUZZ_SECONDS" ${{ matrix.source }} ${{ matrix.floor }}
      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: |
            fuzz-artifacts/
            fuzz-work/*.coverage
          if-no-files-found: ignore
